<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <title>Docx/Doc Preview MVP (.NET Core + LibreOffice)</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            max-width: 900px;
            margin: 40px auto;
        }

        #status {
            color: #666;
            font-size: 14px;
        }

        #result {
            border: 1px solid #ddd;
            margin-top: 10px;
            width: 100%;
            height: 800px;
        }
    </style>
</head>
<body>
    <h2>Docx/Doc Preview MVP（後端轉 PDF 版）</h2>
    <input type="file" id="fileInput" accept=".doc,.docx" />
    <p id="status">請選擇 .doc 或 .docx 檔案</p>
    <iframe id="result" style="display:none;"></iframe>

    <script>
        const fileInput = document.getElementById("fileInput");
        const status = document.getElementById("status");
        const result = document.getElementById("result");

        fileInput.addEventListener("change", async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            status.textContent = "上傳並轉換中，請稍候...";
            result.style.display = "none";

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch("/api/convert", {
                    method: "POST",
                    body: formData,
                });

                if (!response.ok) {
                    const errText = await response.text();
                    status.textContent = "錯誤：" + errText;
                    return;
                }

                const blob = await response.blob();
                const pdfUrl = URL.createObjectURL(blob);
                result.src = pdfUrl;
                result.style.display = "block";
                status.textContent = "已轉換完成：" + file.name;
            } catch (err) {
                status.textContent = "請求失敗：" + err.message;
            }
        });
    </script>
</body>
</html>
